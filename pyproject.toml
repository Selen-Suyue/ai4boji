[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4boji"
version = "0.1.0"
description = "AI4薄肌 — a local-first, bilingual training companion for Codex"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[tool.setuptools]
packages = ["ai4boji"]

[tool.setuptools.package-data]
ai4boji = ["web/*.html", "web/*.js", "web/*.css"]
